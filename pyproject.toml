[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "extraplus"
version = "0.3.0.dev0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "pandas", "matplotlib"]

[project.optional-dependencies]
excel = ["xlwings"]
dev = ["pytest", "jupyter"]
